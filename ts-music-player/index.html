<!DOCTYPE html>
<html>

<head>
    <title>Music Player</title>
    <link href="assets/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <div class="glassBorder">
            <div class="styledContainer">
                <h1>Music Player ♪</h1>

                <div id="musicControls">
                    <button>RANDOM</button>
                    <button><img src="./assets/music_player_back.png" alt="previous song button"></button>
                    <button><img src="./assets/music_player_play.png" alt="music play button"></button>
                    <button><img src="./assets/music_player_forward.png" alt="music player next song"></button>
                    <button>SHUFFLE</button>
                </div>

                <div id="playbackBarContainer">
                    <div id="playbackBarTextLeft">
                        <span id="songProgress">0.00</span>
                    </div>
                    <div>
                        <input type="range" value="0" max="418" step="0.01" title="PlayBack bar">
                    </div>
                    <div>
                        <span id="songDuration">2.13</span>
                    </div>
                </div>

                <div id="musicTracklist">
                    <h1>Hyperpop</h1>
                    <p>XD LOL!!!</p>
                    <p>icantslowdown</p>
                    <p>Castle Crashers</p>
                    <p>##Crycity Cypher</p>
                </div>

                <audio src="./music/XD LOL!!! (PROD 4AM) !!.mp3" autoplay muted></audio>
            </div>
        </div>
    </main>
    <script src="build/app.js" type="module"></script>
</body>

</html>
